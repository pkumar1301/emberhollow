<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Last Hearth</title>
  <link rel="stylesheet" href="village-play.css">
  <script defer src="raid-client.js"></script>
  <script defer src="village-engine.js"></script>
  <script defer src="village-story.js"></script>
  <script defer src="campaign-engine.js"></script>
  <script defer src="campaign-events.js"></script>
  <script defer src="campaign-view.js"></script>
  <script defer src="village-saves.js"></script>
  <script defer src="village-play.js"></script>
</head>
<body>
<main>
  <div class="hud" id="hud">
  <header>
    <h1><span aria-hidden="true">♜</span>The Last Hearth</h1>
    <div class="tools" aria-label="Village controls">
      <span class="village-clock">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="12" class="day-track"/>
          <circle cx="16" cy="16" r="12" pathLength="100" class="day-progress"/>
          <circle cx="16" cy="16" r="3" class="clock-sun"/>
          <path d="M16 8v3m0 10v3M8 16h3m10 0h3m-13.7-5.7 2.1 2.1m7.2 7.2 2.1 2.1m0-11.4-2.1 2.1m-7.2 7.2-2.1 2.1" class="clock-sun"/>
        </svg>
        <strong id="clock"></strong>
      </span>
      <button data-action="overview" id="overview">Village Overview</button>
      <button data-action="nextDay" id="nextDay">Next day</button>
      <button data-action="time" id="time">Resume</button>
      <label class="speed-control" for="speed"><span>Speed</span>
        <select id="speed">
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="3">3×</option>
        </select>
      </label>
      <button id="campaignButton" data-action="campaign:pane:town" hidden>Campaign</button>
      <button id="altarButton" data-action="opening-altar" hidden>Altar</button>
      <button id="menu">Menu</button>
      <button data-action="warning" id="warning"></button>
    </div>
  </header>
  <section class="ledger" aria-label="Village ledger">
    <button id="encounterAlert" data-action="campaign:pane:encounters" hidden></button>
    <button id="foodAlert" data-action="food-alert" hidden></button>
    <div class="stocks" id="stocks" aria-label="Resources, workers, and army"></div>
  </section>
  </div>
  <section id="guide" aria-labelledby="guideTitle">
    <div id="guideText" aria-live="polite"></div>
    <button id="skipGuide" data-action="skip">Skip guidance</button>
  </section>
  <div class="layout" id="layout">
    <div class="map" id="map" aria-label="Playable village map">
      <div id="mapStage" class="map-stage">
        <svg class="trace" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" id="trace"></svg>
      </div>
    </div>
    <aside class="panel" id="panel" aria-label="Village inspector" hidden></aside>
  </div>
  <p id="notice" role="status"></p>
  <dialog id="story" aria-labelledby="storyTitle"><div id="storyContent"></div></dialog>
  <dialog id="encounterMedia" aria-labelledby="encounterMediaTitle">
    <h2 id="encounterMediaTitle">Encounter clip</h2>
    <video id="encounterVideo" controls playsinline></video>
    <button data-action="campaign:close-clip:">Return to encounter</button>
  </dialog>
  <dialog id="settings" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">Village menu</h2>
    <p id="activeProfile"></p>
    <div class="actions">
      <button data-action="save">Save village</button>
      <button data-action="profiles">Profiles &amp; saves</button>
      <button data-action="export-session">Export current game</button>
      <button data-action="restart">New story</button>
      <button data-action="checkpoint">First raid checkpoint</button>
      <button data-action="show-hints" id="showHints" hidden>Show tutorial hints</button>
      <button data-action="closeMenu">Close</button>
    </div>
    <p id="menuStatus" role="status"></p>
  </dialog>
  <dialog id="profiles" aria-labelledby="profilesTitle">
    <h2 id="profilesTitle">Profiles &amp; saves</h2>
    <p>Profiles and progress stay in this browser. Use a backup file to move a save or keep a second copy.</p>
    <div id="profileList"></div>
    <form id="createProfile">
      <label for="profileName">Profile name</label>
      <input id="profileName" name="name" maxlength="32" required>
      <button type="submit">Create profile</button>
    </form>
    <div class="actions">
      <button type="button" id="importSave">Import backup</button>
      <input id="saveFile" type="file" accept=".json,application/json" hidden>
      <button data-action="close-profiles">Close</button>
    </div>
    <p id="profileStatus" role="status"></p>
  </dialog>
</main>
</body>
</html>
